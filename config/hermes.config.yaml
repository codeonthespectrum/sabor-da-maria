# Configuração do Hermes para o Sabor da Maria (ADR 0003).
# Referência do que já está aplicado em ~/.hermes/config.yaml.
#
# Autenticação: Nous Portal via OAuth (`hermes setup --portal` /
# `hermes auth add nous`). NENHUMA chave de API é necessária — o Portal
# roteia modelos, e a assinatura é gerenciada em
# https://portal.nousresearch.com/billing

model:
  # Modelo que dirige a conversa com a Dona Maria.
  default: anthropic/claude-sonnet-4.6
  # Roteamento pelo Portal (OAuth), não por chaves de provider.
  provider: nous

# Subagentes executam tarefas delimitadas (extração de HTML, normalização
# de unidades fora da tabela) com modelo barato e rápido — já aplicado via:
#   hermes config set delegation.provider nous
#   hermes config set delegation.model openai/gpt-5.6-luna
# (Validado com delegate_task real: extração de ingredientes em JSON.)
#
# Retorno ≤ 5s (medido: 3,0–3,5s ponta a ponta): o filho responde em 1 turno
# com o texto inline no contexto, sem tools — ver "Delegação ao subagente"
# no AGENTS.md. service_tier=priority elimina a variância do Portal (sem ele,
# picos de 5,5s; com ele, estável em ~3s — pode custar mais créditos).
# Os limites abaixo impedem filho desgovernado: max 10 iterações e 45s de
# inatividade.
delegation:
  provider: nous
  model: openai/gpt-5.6-luna
  max_iterations: 10
  child_timeout_seconds: 45
  request_overrides:
    service_tier: priority

# Diretório de trabalho das sessões de mensageria (gateway/cron). SEM isto,
# as sessões do WhatsApp não herdam o workspace e o AGENTS.md deste repo
# (persona + regras) não é injetado no prompt — o agente responde genérico.
# Aplicado via: hermes config set terminal.cwd /Users/kimgomes/Desktop/agent-challenge
terminal:
  cwd: /Users/kimgomes/Desktop/agent-challenge

# Canal: WhatsApp via bridge Baileys (`hermes whatsapp` para parear por
# QR code). Usar número SECUNDÁRIO — bridges não-oficiais podem ser
# banidas no número principal. Fallback: WhatsApp Cloud API ou Telegram.
platforms:
  whatsapp:
    enabled: true
    # Home channel: para onde vão resultados de cron e avisos do gateway.
    # SEM isto, a primeira mensagem de cada sessão nova dispara o aviso
    # "📬 No home channel is set for whatsapp..." para a Dona Maria.
    home_channel:
      platform: whatsapp
      chat_id: 168100943147203@lid
      name: Dona Maria
    # Silencia TODA mensagem de ciclo de vida do gateway no chat:
    # "♻️ Gateway online", "gateway restarted", aviso de shutdown e o
    # notice de restart planejado. Sem isto, cada `hermes gateway restart`
    # manda 2 bolhas técnicas para a Dona Maria. Validado no log:
    # "Shutdown/startup notification suppressed ... gateway_restart_notification=false"
    gateway_restart_notification: false

# Higiene do chat: a Dona Maria não é técnica — ela nunca deve ver bolhas
# de progresso ("terminal cd /Users/...") nem narração de meio de turno.
# Sem tool_progress: off, cada chamada de tool vira uma mensagem separada
# no WhatsApp (o adaptador não edita bolhas como o Telegram).
display:
  platforms:
    whatsapp:
      tool_progress: false          # false normaliza para "off"
      interim_assistant_messages: false
      # Sem estes, turns longos (busca de receitas) mandam bolhas do tipo
      # "⏳ Working — 2min — iteration 23/150" para a Dona Maria.
      long_running_notifications: false
      busy_ack_detail: false

# Silêncio de bastidor — duas camadas FORA do config.yaml:
#
# 1) Overlay de locales (config/locales/*.yaml → copiar para
#    ~/.hermes/locales/): esvazia os textos que o gateway mandaria
#    espontaneamente e que NÃO têm chave de config:
#      - gateway.session.auto_reset_notice ("◐ Sessão reiniciada...")
#      - gateway.session.auto_reset_context_exhausted (anexada à resposta)
#      - gateway.startup.online/restarted (cinto-e-fivelas do flag acima)
#      - gateway.notify.no_home_channel (idem)
#      - gateway.busy.ack (idem do item 2)
#    O overlay faz merge por chave sobre o catálogo embutido; texto vazio
#    = t() devolve "" e nada é entregue.
#
# 2) HERMES_GATEWAY_BUSY_ACK_ENABLED=false no EnvironmentVariables do
#    plist (~/Library/LaunchAgents/ai.hermes.gateway.plist): desliga de
#    vez o aviso de "ocupado" quando ela manda mensagem com um turn
#    rodando — com nossos turns de 10s+, isso dispararia direto.
#    busy_ack_detail: false (acima) só tirava o detalhe, não o aviso.

# Núcleo determinístico: as tools de agent_tools/ são Python puro e NUNCA
# delegam aritmética ao LLM (ver ADR 0001 e ADR 0003).

# Background review: rotina do Hermes que relê a conversa para "melhorar a
# biblioteca de skills". Não entrega nada no chat (confirmado), mas queimava
# 24–50K tokens de cache por rajada no meio da conversa da Dona Maria.
auxiliary:
  background_review:
    enabled: false
